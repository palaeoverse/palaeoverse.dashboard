on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:

name: refresh-data

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      # Authenticated GitHub API calls (higher rate limit) for gh::gh()
      GITHUB_PAT: ${{ secrets.DASHBOARD_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Add Ubuntu dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev libcurl4-openssl-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Refresh data
        run: Rscript fetch.R

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "[auto] Refresh data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
