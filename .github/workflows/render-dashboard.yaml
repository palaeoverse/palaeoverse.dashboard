on:
  push:
    branches: [main]
    paths:
      - 'index.qmd'
      - '_package.qmd'
      - 'stats.R'
      - 'data/**'
      - '_brand/**'
      - 'custom.scss'
  schedule:
    - cron: "0 6 * * *"   # daily, after the data refresh
  workflow_dispatch:

name: render-dashboard

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  render-dashboard:
    runs-on: ubuntu-latest
    env:
      # Authenticated GitHub API calls (gh::gh(), universe) get a higher rate limit
      GITHUB_PAT: ${{ secrets.DASHBOARD_PAT }}
      # Codecov API access for coverage/cyclomatic-complexity stats (stats.R)
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add Ubuntu dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Setup R 
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}